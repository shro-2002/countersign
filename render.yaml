# Render Blueprint for the hosted judge demo. Applying it CREATES PAID RESOURCES (about $20/month; see
# docs/HOSTING_PLAN.md). Do not apply without the owner's approval. Secrets are prompted for (sync: false) or
# generated by Render; none are stored here.
services:
  # Private service: no public URL. Only the web proxy can reach it, over Render's private network.
  - type: pserv
    name: countersign-api
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: "off" # deploy deliberately during judging
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn countersign.api:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: COUNTERSIGN_DEMO_MODE
        value: judge
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com # the app refuses any other host
      - key: PAYPAL_CLIENT_ID # a sandbox REST app created only for this demo
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY # free tier, a Google project separate from development, no billing account
        sync: false
      - key: COUNTERSIGN_LLM_BUDGET
        value: "12"
      - key: COUNTERSIGN_OPERATOR_TOKEN
        generateValue: true
      - key: COUNTERSIGN_DB_URL
        fromDatabase:
          name: countersign-db
          property: connectionString

  - type: web
    name: countersign-web
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    buildCommand: cd web && npm ci --no-fund && npm run build
    startCommand: cd web && npm run start
    healthCheckPath: /api/health # proxied to the API: checks both services
    envVars:
      - key: NODE_VERSION
        value: "22.23.3"
      - key: COUNTERSIGN_API_URL
        fromService:
          name: countersign-api
          type: pserv
          property: hostport
      - key: COUNTERSIGN_OPERATOR_TOKEN
        fromService:
          name: countersign-api
          type: pserv
          envVarKey: COUNTERSIGN_OPERATOR_TOKEN
      - key: COUNTERSIGN_DEMO_ACCESS_CODE # at least 12 random characters; share only in Devpost testing notes
        sync: false
      - key: COUNTERSIGN_SESSION_SECRET
        generateValue: true

databases:
  - name: countersign-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: countersign
    user: countersign
    postgresMajorVersion: "17"
    ipAllowList: [] # no external connections; the API connects over the private network
