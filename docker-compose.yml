services:
  countersign-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: countersign
      POSTGRES_USER: countersign
      POSTGRES_PASSWORD: ${COUNTERSIGN_DB_PASSWORD:?set COUNTERSIGN_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - countersign-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countersign -d countersign"]
      interval: 2s
      retries: 30

volumes:
  countersign-pg:
